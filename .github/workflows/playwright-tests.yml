name: Playwright Test Suite

# Workflow configuration
defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight
  workflow_dispatch:  # Manual trigger

jobs:
  test-dev:
    name: Dev Environment Tests
    environment: dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [api, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install
          npx playwright install-deps
      - name: Run ${{ matrix.test-type }} tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        if: env.BASE_URL != '''' && env.API_KEY != ''''
        run: npx playwright test src/tests/${{ matrix.test-type }}/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.test-type }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  test-staging:
    name: Staging Environment Tests
    environment: staging
    needs: test-dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install
          npx playwright install-deps
      - name: Run regression tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        if: env.BASE_URL != '''' && env.API_KEY != ''''
        run: npx playwright test src/tests/regression/ --project=${{ matrix.browser }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-regression-${{ matrix.browser }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  test-prod:
    name: Production Environment Tests
    environment: prod
    needs: test-staging
    runs-on: ubuntu-latest
    if: github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install
          npx playwright install-deps
      - name: Run performance tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        if: env.BASE_URL != '''' && env.API_KEY != ''''
        run: npx playwright test src/tests/performance/
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-performance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  notify:
    name: Notify Test Results
    needs: [test-dev, test-staging, test-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Test Status
        shell: bash
        run: |
          if [[ "${{ needs.test-dev.result }}" == "failure" ]] || 
             [[ "${{ needs.test-staging.result }}" == "failure" ]] || 
             [[ "${{ needs.test-prod.result }}" == "failure" ]]; then
            echo "::error::One or more test suites failed"
            exit 1
          fi
