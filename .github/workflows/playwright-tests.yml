name: Playwright Test Suite

# Required environment variables and secrets for each environment:
# - dev:
#   - vars.BASE_URL: Development environment URL
#   - secrets.API_KEY: API key for development environment
# - staging:
#   - vars.BASE_URL: Staging environment URL
#   - secrets.API_KEY: API key for staging environment
# - prod:
#   - vars.BASE_URL: Production environment URL
#   - secrets.API_KEY: API key for production environment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight
  workflow_dispatch:  # Manual trigger

jobs:
  test-dev:
    name: Dev Environment Tests
    environment: dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [api, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dev Environment Variables
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ vars.BASE_URL }}")) {
            Write-Error "BASE_URL environment variable is not set for dev environment"
            exit 1
          }
          if ([string]::IsNullOrEmpty("${{ secrets.API_KEY }}")) {
            Write-Error "API_KEY secret is not set for dev environment"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.test-type }} tests
        run: npx playwright test src/tests/${{ matrix.test-type }}/
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.test-type }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  test-staging:
    name: Staging Environment Tests
    environment: staging
    needs: test-dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Staging Environment Variables
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ vars.BASE_URL }}")) {
            Write-Error "BASE_URL environment variable is not set for staging environment"
            exit 1
          }
          if ([string]::IsNullOrEmpty("${{ secrets.API_KEY }}")) {
            Write-Error "API_KEY secret is not set for staging environment"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run regression tests
        run: npx playwright test src/tests/regression/ --project=${{ matrix.browser }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-regression-${{ matrix.browser }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  test-prod:
    name: Production Environment Tests
    environment: prod
    needs: test-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Production Environment Variables
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ vars.BASE_URL }}")) {
            Write-Error "BASE_URL environment variable is not set for production environment"
            exit 1
          }
          if ([string]::IsNullOrEmpty("${{ secrets.API_KEY }}")) {
            Write-Error "API_KEY secret is not set for production environment"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run performance tests
        run: npx playwright test src/tests/performance/
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-performance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  notify:
    name: Notify Test Results
    needs: [test-dev, test-staging, test-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Test Status
        shell: bash
        run: |
          if [[ "${{ needs.test-dev.result }}" == "failure" ]] || 
             [[ "${{ needs.test-staging.result }}" == "failure" ]] || 
             [[ "${{ needs.test-prod.result }}" == "failure" ]]; then
            echo "::error::One or more test suites failed"
            exit 1
          fi
